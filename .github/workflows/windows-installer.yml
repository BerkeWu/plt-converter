name: windows-installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Install QPDF (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install qpdf:x64-windows --clean-after-build
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build, test, deploy, package
        shell: pwsh
        run: .\packaging\build_windows.ps1 -QtDir "$env:QT_ROOT_DIR" -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: PLT-Converter-windows
          path: |
            dist/PLT-Converter-Setup-*.exe
            dist/PLT-Converter-portable-*.zip
